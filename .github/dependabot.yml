version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # The runtime is Node 22 LTS; these majors need a newer Node 22.x than the minimum we support.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jsdom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-jsdoc'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node 22 LTS line; odd-numbered majors are not long-term supported.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
